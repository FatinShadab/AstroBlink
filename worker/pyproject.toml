[project]
name = "astroblink-worker"
version = "0.1.0"
description = "AstroBlink ingestion worker"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: integration tests that fetch real SPHEREx data (excluded from default CI)",
]
addopts = "-m 'not real_data'"

