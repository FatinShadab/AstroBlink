# ==============================================================
# AstroBlink — Docker Compose Base
# Run from repo root: docker compose -f infra/docker-compose.yml --project-directory . up
# Or use: make up
# ==============================================================

services:
  # ── Data stores ─────────────────────────────────────────────
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astroblink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astroblink_dev}
      POSTGRES_DB: ${POSTGRES_DB:-astroblink}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astroblink}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine3.21
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${TILE_S3_BUCKET:-astroblink-tiles};
      mc anonymous set download local/${TILE_S3_BUCKET:-astroblink-tiles};
      echo 'Bucket ready.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TILE_S3_BUCKET: ${TILE_S3_BUCKET:-astroblink-tiles}

  # ── Database migration (one-shot) ──────────────────────────
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "alembic", "upgrade", "head"]
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://astroblink:astroblink_dev@postgres:5432/astroblink}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Application services ───────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://astroblink:astroblink_dev@postgres:5432/astroblink}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TILE_S3_ENDPOINT: ${TILE_S3_ENDPOINT:-http://minio:9000}
      TILE_S3_BUCKET: ${TILE_S3_BUCKET:-astroblink-tiles}
      TILE_S3_ACCESS_KEY: ${TILE_S3_ACCESS_KEY:-minioadmin}
      TILE_S3_SECRET_KEY: ${TILE_S3_SECRET_KEY:-minioadmin}
      TILE_BASE_URL: ${TILE_BASE_URL:-http://localhost:9000/astroblink-tiles}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      TILE_BASE_URL: ${TILE_BASE_URL:-http://localhost:9000/astroblink-tiles}
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://astroblink:astroblink_dev@postgres:5432/astroblink}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TILE_S3_ENDPOINT: ${TILE_S3_ENDPOINT:-http://minio:9000}
      TILE_S3_BUCKET: ${TILE_S3_BUCKET:-astroblink-tiles}
      TILE_S3_ACCESS_KEY: ${TILE_S3_ACCESS_KEY:-minioadmin}
      TILE_S3_SECRET_KEY: ${TILE_S3_SECRET_KEY:-minioadmin}
      SPHEREX_S3_BUCKET: ${SPHEREX_S3_BUCKET:-nasa-irsa-spherex}
      SPHEREX_S3_REGION: ${SPHEREX_S3_REGION:-us-east-1}
      IRSA_CUTOUT_BASE_URL: ${IRSA_CUTOUT_BASE_URL:-https://irsa.ipac.caltech.edu/cgi-bin/Cutouts/nph-cutouts}
      FITS_SCRATCH_DIR: /tmp/astroblink
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - worker

volumes:
  pgdata:
  miniodata:
