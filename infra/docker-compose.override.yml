# ==============================================================
# AstroBlink — Docker Compose Dev Override
# Auto-loaded by docker compose (override file).
# Adds bind mounts, hot reload, dev targets.
# ==============================================================

services:
  api:
    build:
      target: dev
    volumes:
      - ./api/app:/build/app
      - ./api/tests:/build/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  client:
    build:
      target: dev
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/__tests__:/app/__tests__
    command: ["npm", "run", "dev"]

  worker:
    build:
      target: dev
    volumes:
      - ./worker/worker:/build/worker
      - ./worker/tests:/build/tests
      - ./contracts:/contracts:ro
